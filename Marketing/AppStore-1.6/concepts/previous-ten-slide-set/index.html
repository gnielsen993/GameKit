<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameDrawer — Previous ten-slide concepts</title><style>body{margin:32px;background:#f4f0e6;color:#292722;font:17px/1.5 system-ui}main{max-width:1440px;margin:auto}a{color:#ba382b}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}img{width:100%;display:block}h2{font-size:18px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}button{font:inherit;padding:10px 20px;margin:0 12px 24px 0;cursor:pointer}button[aria-pressed=true]{background:#292722;color:#f4f0e6}</style><main><a href="../../index.html">Current App Store selection</a><h1>Previous ten-slide set</h1><p>All original exports are preserved here, including the single-game Merge video concept and the Video Mode position picker. These are alternates, not the current upload order.</p><button data-family="iphone" aria-pressed="true">iPhone</button><button data-family="ipad" aria-pressed="false">iPad</button><div class="grid"></div></main><script src="slides.js"></script><script>function show(family){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.family===family));document.querySelector('.grid').replaceChildren();slides.forEach(s=>{const section=document.createElement('section'),a=document.createElement('a'),img=document.createElement('img'),h=document.createElement('h2');a.href=`exports/${family}/${s.id}.png`;img.src=a.href;img.alt=s.title.replaceAll('\n',' ');a.append(img);h.textContent=img.alt;section.append(a,h);document.querySelector('.grid').append(section)})}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.family));show('iphone');</script></html>
