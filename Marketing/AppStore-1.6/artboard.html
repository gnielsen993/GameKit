<!doctype html><html lang="en"><meta charset="utf-8"><title>GameDrawer artwork</title>
<style>
@font-face{font-family:Barlow;src:url(fonts/BarlowCondensed-Bold.ttf);font-weight:700}
:root{--paper:#f4f0e6;--ink:#292722;--red:#ba382b;--white:#fffaf0;--gutter:80px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);width:1320px;height:2868px;overflow:hidden;font-family:Arial,sans-serif}.red{background:var(--red);color:var(--white)}.ink{background:var(--ink);color:var(--white)}header{position:absolute;top:78px;left:var(--gutter);right:var(--gutter)}.brand{font-size:32px;font-weight:700;letter-spacing:2px;margin:0 0 40px}h1{font-family:Barlow,sans-serif;font-size:155px;line-height:.98;letter-spacing:-2px;margin:0;white-space:pre-line}p.deck{font-size:39px;line-height:1.35;max-width:1120px;margin:32px 0 0}.device{position:absolute;width:944px;left:188px;top:686px;border:12px solid var(--ink);border-radius:86px;overflow:hidden;box-shadow:0 28px 65px #0003;background:var(--ink)}.device img{display:block;width:100%;height:auto}.note{position:absolute;bottom:31px;left:80px;right:80px;text-align:center;font-size:26px;line-height:1.3}.themes .device{width:790px;left:265px;top:1060px;z-index:2}.themes .side{width:520px;top:780px;z-index:1;opacity:1}.themes .left{left:46px}.themes .right{left:754px}.themes .device{border-width:10px;border-radius:65px}.ipad{width:2064px;height:2752px;--gutter:110px}.ipad header{top:64px}.ipad h1{font-size:152px}.ipad .brand{margin-bottom:30px}.ipad .deck{max-width:1750px;font-size:44px}.ipad .device{width:1300px;left:382px;top:666px;border-radius:64px}.ipad .note{font-size:29px;bottom:33px}.ipad.themes .device{width:1160px;left:452px;top:910px}.ipad.themes .side{width:770px;top:700px}.ipad.themes .left{left:60px}.ipad.themes .right{left:1234px}

.watch{background:radial-gradient(ellipse at 70% 43%,#74533f 0,transparent 50%),#292722}
.video-window{position:absolute;left:4%;top:8%;width:92%;aspect-ratio:16/9;border-radius:30px;overflow:hidden;background:radial-gradient(ellipse at 72% 30%,#a493ca 0,transparent 55%),linear-gradient(145deg,#314360,#666294 50%,#dc9874);box-shadow:0 12px 26px #0004;color:#fffaf0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.video-window:before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#171e3888,transparent 65%)}
.video-window strong{position:relative;font-family:Barlow,sans-serif;font-size:76px;line-height:1}
.video-window span{position:relative;font-size:22px;letter-spacing:3px;text-transform:uppercase}
.video-window .playback{position:absolute;bottom:22px;left:30px;right:30px;display:flex;align-items:center;gap:20px}
.pause{width:18px;height:22px;border-left:6px solid currentColor;border-right:6px solid currentColor}.timeline{height:4px;background:#fff6;flex:1;border-radius:4px}.timeline:before{content:'';display:block;background:#fffaf0;width:38%;height:100%;border-radius:4px}
.ipad .video-window{width:72%;left:14%;top:4%;border-radius:30px}.ipad .video-window strong{font-size:100px}.ipad .video-window span{font-size:28px}
</style><header><div class="brand">GameDrawer</div><h1></h1><p class="deck"></p></header><main></main><footer class="note"></footer>
<script src="slides.js"></script><script>
const params=new URLSearchParams(location.search), family=params.get('device')==='ipad'?'ipad':'iphone', s=slides.find(x=>x.id===params.get('slide'))||slides[0];
document.body.className=[family,s.tone,s.themes?'themes':'',s.video?'watch':''].join(' ');document.querySelector('h1').textContent=s.title;document.querySelector('.deck').textContent=s.deck;document.querySelector('.note').textContent=s.note||'';
function frame(source,cls=''){const div=document.createElement('div');div.className='device '+cls;const img=document.createElement('img');img.src=`raw/${family}/${source}.png`;img.alt=source;div.append(img);document.querySelector('main').append(div);return div}
if(s.themes){frame('home-classic','side left');frame('home-voltage','side right')}const primary=frame(s.source);if(s.video){const window=document.createElement('div');window.className='video-window';window.setAttribute('aria-label','Illustrative picture-in-picture video window');window.innerHTML='<span>Picture-in-picture</span><strong>Your video</strong><div class=playback><i class=pause></i><i class=timeline></i></div>';primary.append(window)}
</script></html>
